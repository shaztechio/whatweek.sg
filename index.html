<!DOCTYPE html>
<html lang="en">
<head>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta charset="utf-8" />
  <meta property="og:title" content="Is this an Odd or Even School Week?">
  <meta property="og:description" content="Find out if today's date is an odd or even school week in Singapore.">
  <meta property="og:image" content="https://upload.wikimedia.org/wikipedia/commons/thumb/3/3c/Yin_and_Yang_symbol.svg/240px-Yin_and_Yang_symbol.svg.png">
  <link rel="stylesheet" type="text/css" href="index.css" />
  <link rel="icon" type="image/png" href="/index.png">
  <link rel="apple-touch-icon" href="/index.png">
  <link
    rel="stylesheet"
    href="https://cdn.jsdelivr.net/gh/philfung/add-to-homescreen@2.98/dist/add-to-homescreen.min.css"
  />
  <meta name="apple-mobile-web-app-title" content="Odd or Even">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="theme-color" content="#ffffff">
  <title>Is this an Odd or Even School Week?</title>
</head>
<body>
  <div class="container">
    <p class="header line" title="Is this an Odd or Even School Week?">
        <span class="oe-decorator"></span><span class="odd-or-even"></span><span class="oe-decorator"></span>
    </p>
    <p class="description line">
      <span>
        <a target="_blank" href="https://en.wikipedia.org/wiki/Wikipedia:On_this_day/Today">Today</a> is week <span class="week-number"></span>
      </span>
    </p>
    <p class="footer line">
      <span>
        *based on the <span title="Singapore flag">🇸🇬</span> <a target="_blank" href="https://en.wikipedia.org/wiki/Academic_year#:~:text=Term%201%20starts%20the%20day%20immediately%20after%20New%20Year%27s%20Day.%20If%20the%20first%20school%20day%20is%20a%20Thursday%20or%20a%20Friday%2C%20it%20is%20not%20counted%20as%20a%20school%20week.">Singapore school system</a>
      </span>
    </p>
    <button id="install-pwa" class="install-pwa">Install ⚙️</button>
  </div>
  <script src="https://cdn.jsdelivr.net/gh/philfung/add-to-homescreen@2.98/dist/add-to-homescreen.min.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', function () {
      window.AddToHomeScreenInstance = window.AddToHomeScreen({
        appName: 'Odd or Even',
        appNameDisplay: 'standalone',
        appIconUrl: 'index.png',
        assetUrl: 'https://cdn.jsdelivr.net/gh/philfung/add-to-homescreen@2.98/dist/assets/img/'
      })

      const ua = navigator.userAgent.toLowerCase()
      const isIPhone = /iphone/.test(ua)
      const isIPad = /ipad/.test(ua)
      const isIOS = isIPhone || isIPad
      const isInStandaloneMode = isIOS && navigator.standalone

      if (isInStandaloneMode) {
        document.getElementById('install-pwa').classList.add('hidden')
      } else {
        document.getElementById('install-pwa').classList.remove('hidden')
        document.getElementById('install-pwa').addEventListener('click', function () {
          window.AddToHomeScreenInstance.show('en');
        });
      }
    })
  </script>
  <script type="text/javascript" src="index.js"></script>
</body>
</html>
