<!DOCTYPE html>
<html lang="en">
<head>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta charset="utf-8" />
  <meta property="og:title" content="Is this an Odd or Even School Week?" />
  <meta property="og:description" content="Find out if today's date is an odd or even school week in Singapore." />
  <meta property="og:image" content="https://upload.wikimedia.org/wikipedia/commons/thumb/3/3c/Yin_and_Yang_symbol.svg/240px-Yin_and_Yang_symbol.svg.png" />
  <link rel="stylesheet" type="text/css" href="src/styles/index.css" />
  <link rel="icon" type="image/png" href="index.png" />
  <link rel="apple-touch-icon" href="index.png" />
  <link rel="stylesheet" href="src/assets/vendor/add-to-homescreen/add-to-homescreen.min.css" />
  <link rel="manifest" href="manifest.json" crossorigin="use-credentials" />
  <meta name="apple-mobile-web-app-title" content="Odd or Even" />
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="theme-color" content="#ffffff" />
  <title>Is this an Odd or Even School Week?</title>
</head>
<body>
  <div class="container">
    <p class="header line" title="Is this an Odd or Even School Week?">
        <span class="odd-or-even"></span><span class="oe-decorator"></span>
    </p>
    <p class="description line">
      <span class="description-decorator">Today is</span> week <span class="week-number"></span>
    </p>
    <p class="date line">
      <span class="today-date"></span> 
    </p>
    <p class="footer line">
      <span>
        *<span class="footer-decorator">based on the Singapore</span> <span title="Singapore flag">🇸🇬</span> school system
      </span>
    </p>
    <button type="button" id="install-pwa" class="install-pwa"><span class="button-decorator">Install</span> ⚙️</button>
  </div>
  <script type="module" src="src/assets/vendor/add-to-homescreen/add-to-homescreen.min.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', function () {
      window.AddToHomeScreenInstance = window.AddToHomeScreen({
        appName: 'Odd or Even',
        appNameDisplay: 'standalone',
        appIconUrl: 'index.png',
        assetUrl: './add-to-homescreen/img/',
        displayOptions:{ showMobile: true, showDesktop: false }
      })

      const { 
        isStandAlone,
        isBrowserAndroidChrome,
        isBrowserAndroidFacebook,
        isBrowserAndroidFirefox,
        isBrowserAndroidSamsung,
        isBrowserIOSChrome,
        isBrowserIOSFirefox,
        isBrowserIOSInAppFacebook,
        isBrowserIOSInAppInstagram,
        isBrowserIOSInAppLinkedin,
        isBrowserIOSInAppThreads,
        isBrowserIOSInAppTwitter,
        isBrowserIOSSafari
      } = window.AddToHomeScreenInstance
      const isInStandAloneMode = isStandAlone()
      const isBrowserAndroid = isBrowserAndroidChrome() || isBrowserAndroidFacebook() || isBrowserAndroidFirefox() || isBrowserAndroidSamsung()
      const isBrowserIOS = isBrowserIOSChrome() || isBrowserIOSFirefox() || isBrowserIOSInAppFacebook() || isBrowserIOSInAppInstagram() || isBrowserIOSInAppLinkedin() || isBrowserIOSInAppThreads() || isBrowserIOSInAppTwitter() || isBrowserIOSSafari()
      const isDesktop = !isBrowserAndroid && !isBrowserIOS
      if (isInStandAloneMode || isDesktop) {
        document.getElementById('install-pwa').classList.add('hidden')
      } else {
        document.getElementById('install-pwa').classList.remove('hidden')
        document.getElementById('install-pwa').addEventListener('click', function () {
          window.AddToHomeScreenInstance.show('en');
        });
      }
    })
  </script>
  <script type="module" src="src/js/index.js"></script>
</body>
</html>
