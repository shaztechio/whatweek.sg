name: CI

# All changes land through a pull request (see AGENTS.md), but the deploy
# workflow only runs on push to main -- so without this, a PR would get no
# checks at all and a break would surface only after it merged and deployed.
on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# A new push to the same PR supersedes the run in flight.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Unit tests and build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npm test

      # vite-plugin-eslint lints as part of the build
      - run: npm run build

  e2e:
    name: Browser tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # Chromium only -- the full three-browser matrix runs locally via
      # `npm run test:e2e`. This keeps PR feedback quick.
      - run: npx playwright install --with-deps chromium

      # pretest:e2e builds first, and playwright.config.js boots a preview
      # server against the build.
      - run: npm run test:e2e -- --project=chromium

      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
